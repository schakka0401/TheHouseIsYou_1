name: Infrastructure checks

on:
  push:
    branches:
      - integrate-backend
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  infrastructure:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      COMPOSE_PROJECT_NAME: house-ci-${{ github.run_id }}-${{ github.run_attempt }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Create isolated test configuration
        shell: bash
        run: |
          cat > .env <<'ENV'
          POSTGRES_DB=house_ci
          POSTGRES_USER=house_ci
          POSTGRES_PASSWORD=ci_only_password
          DATABASE_URL=postgresql+psycopg://house_ci:ci_only_password@database:5432/house_ci
          ENV

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Build API image
        run: docker compose build api

      - name: Start PostgreSQL
        run: docker compose up -d --wait --wait-timeout 90 database

      - name: Apply migrations to empty database
        run: docker compose run --rm --no-deps api python -m alembic upgrade head

      - name: Check database matches models
        run: docker compose run --rm --no-deps api python -m alembic check

      - name: Start API
        run: docker compose up -d --wait --wait-timeout 90 api

      - name: Test session and result lifecycle
        shell: bash
        run: |
          docker compose exec -T api python - <<'PY'
          import json
          import urllib.request

          BASE_URL = "http://127.0.0.1:8000"

          def request(path, payload=None, expected_status=200):
              body = None if payload is None else json.dumps(payload).encode()
              req = urllib.request.Request(
                  BASE_URL + path,
                  data=body,
                  headers={"Content-Type": "application/json"},
                  method="GET" if payload is None else "POST",
              )
              with urllib.request.urlopen(req, timeout=10) as response:
                  assert response.status == expected_status, response.status
                  return json.load(response)

          assert request("/health")["status"] == "healthy"
          assert request("/ready")["database"] == "connected"

          session = request(
              "/sessions",
              {"player_name": "ci_test"},
              expected_status=201,
          )
          session_id = session["id"]
          assert session["total_score"] == 0

          result = request(
              f"/sessions/{session_id}/results",
              {
                  "game_name": "ci_test",
                  "input_data": {"test": True},
                  "result_data": {"passed": True},
                  "score_change": 250,
                  "duration_ms": 42,
              },
              expected_status=201,
          )
          assert result["session_id"] == session_id

          saved_session = request(f"/sessions/{session_id}")
          assert saved_session["total_score"] == 250, saved_session

          results = request(f"/sessions/{session_id}/results")
          assert len(results) == 1, results
          assert results[0]["id"] == result["id"]
          assert results[0]["result_data"] == {"passed": True}

          print("PASS: readiness, session creation, result storage, and score update")
          PY

      - name: Show container logs
        if: always()
        run: docker compose logs --no-color --tail 100

      - name: Remove CI containers and test volume
        if: always()
        run: docker compose down --volumes --remove-orphans